[project]
name = "leporis-agentlint"
version = "0.1.0"
description = "Audit MCP server configurations for security risks"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
]

[project.scripts]
agentlint = "agentlint.main:app"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
