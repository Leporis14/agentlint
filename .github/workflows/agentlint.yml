name: agentlint

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  agentlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install agentlint
        run: pip install .
      - name: Run agentlint CI check
        run: agentlint ci
